[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tremula"
description = "Plant realistic bugs, see if your tests tremble."
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]
dependencies = ["tremula-python==0.1.*"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/tremula/Cargo.toml"
module-name = "tremula"
python-source = "python"
strip = true

[tool.uv.workspace]
members = ["packs/python"]

[tool.uv.sources]
tremula-python = { workspace = true }
