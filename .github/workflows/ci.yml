name: ci

on:
  push:
    branches: [main]
  pull_request:

# A check reads the repository and writes nothing back to it.
permissions:
  contents: read

# A newer push to the same ref makes the runs still in flight worthless, and
# they bill the same as a useful one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  python-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run --package tremula-python ruff check packs/python
      - run: uv run --package tremula-python pyright packs/python
      - run: uv run --package tremula-python pytest packs/python/tests

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
      # Installs the language pack and its execution backend into `.venv`, which
      # is the interpreter the end-to-end tests hand to the binary.
      - run: uv sync
      - run: uv run tremula --version
      # Snapshots are assertions here, never updated by a run that disagrees.
      - run: cargo test --features e2e --test e2e --test e2e_generate --test e2e_bundle --test e2e_selection
        env:
          INSTA_UPDATE: "no"
