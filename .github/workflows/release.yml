name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A job that needs to write a release or mint an OIDC token asks for it itself.
permissions:
  contents: read

# Two runs of the same ref must never race to publish the same version, and the
# second one must not be thrown away either.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        if: matrix.os == 'ubuntu-latest'
        with:
          args: --release --locked --out dist
          manylinux: 2_28
          before-script-linux: yum install -y openssl-devel
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        if: matrix.os == 'macos-14'
        with:
          args: --release --locked --out dist
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        if: matrix.os == 'ubuntu-latest'
      - name: Build tremula-python wheel
        if: matrix.os == 'ubuntu-latest'
        run: uv build --wheel --out-dir dist packs/python
      - name: Smoke test both wheels
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install dist/tremula-*.whl dist/tremula_python-*.whl
          .venv-smoke/bin/tremula --version
          .venv-smoke/bin/pip show tremula | grep -i '^Requires:.*tremula-python'
      - name: Smoke test tremula wheel
        if: matrix.os == 'macos-14'
        run: |
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install --no-deps dist/tremula-*.whl
          .venv-smoke/bin/tremula --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # The two packages publish from two jobs with two environments, because a PyPI
  # pending publisher must be unique on (owner, repository, workflow, environment)
  # and this repository bootstraps two project names from one workflow. The pack
  # goes first: `tremula` depends on `tremula-python==0.1.*`, so the dependency has
  # to exist on the index before the CLI that requires it does.
  publish-pack:
    # Runs only for a tag, only while the repository variable PYPI_PUBLISH_ENABLED
    # is 'true', and only after a required reviewer approves the `pypi-pack`
    # environment. Uploads tremula-python through PyPI Trusted Publishing; no API
    # token is stored.
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi-pack
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Keep only the language pack wheel
        run: |
          mkdir upload
          mv dist/tremula_python-*.whl upload/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload

  publish:
    # Same gate as publish-pack, against the `pypi` environment, and only after the
    # pack it depends on is already on the index. Uploads every tremula wheel the
    # `wheels` job produced (Linux x86_64 and macOS arm64).
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [wheels, publish-pack]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Keep only the tremula wheels
        run: |
          mkdir upload
          mv dist/tremula-*.whl upload/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload

  release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Extract standalone macOS binary and checksum
        run: |
          mkdir release-assets
          for wheel in dist/tremula-*macosx*.whl; do
            binary="release-assets/tremula-macos-arm64"
            unzip -p "$wheel" '*/scripts/tremula' > "$binary"
            chmod +x "$binary"
            sha256sum "$binary" > "${binary}.sha256"
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.whl
            release-assets/*
