[package]
name = "tremula"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plant realistic bugs, see if your tests tremble."

[dependencies]
clap = { version = "4", features = ["derive"] }
tremula-contracts = { path = "../tremula-contracts" }
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timestamps: `formatting` renders them, `macros` compiles a run identifier's
# own format at build time.
time = { version = "0.3", features = ["formatting", "macros"] }
# Asking whether a process is still alive, with no `unsafe` block of our own.
rustix = { version = "1", features = ["process"] }
# The schema a model is held to when it answers, derived from the type that
# reads the answer, so the two cannot drift apart.
schemars = "1"
# One HTTPS call at a time, to a model provider. `blocking` keeps the calling
# surface synchronous, which is what the rest of this binary is; it is honest
# about starting a runtime of its own on a thread behind that surface, and this
# is not a claim to have avoided one. `default-tls` is the platform's own TLS —
# see deny.toml for why the alternative is not available here.
#
# `"0.12"` is a compatibility range and not an exact pin: any 0.12.x resolves,
# and only the 0.12 series does. The series boundary is the point, because a
# later one redefines what `default-tls` selects, which is a decision about what
# this project ships rather than a version bump.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
# A directory of its own for each one-mutant manifest handed to the language pack.
# The pack is a subprocess that reads a path, so the document has to exist
# somewhere, and somewhere is not the project being generated for.
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
# `parsing` is for the tests that read a document's timestamps back.
time = { version = "0.3", features = ["macros", "parsing"] }

[features]
# The end-to-end tests need an interpreter with the language pack and its
# execution backend installed, so the whole target is opt-in rather than part of
# `cargo test`.
e2e = []
# The accuracy measurement needs the same interpreter, and runs a witness for
# every one of thirty-eight labelled mutations. Opt-in for the time that takes,
# and separate from `e2e` because it is a measurement rather than a check that the
# pipeline holds together.
judge_accuracy = []

[[test]]
name = "e2e"
required-features = ["e2e"]

[[test]]
name = "e2e_generate"
required-features = ["e2e"]

[[test]]
name = "judge_accuracy"
required-features = ["judge_accuracy"]

[lints]
workspace = true
