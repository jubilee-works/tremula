[package]
name = "tremula"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plant realistic bugs, see if your tests tremble."

[dependencies]
clap = { version = "4", features = ["derive"] }
tremula-contracts = { path = "../tremula-contracts" }
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timestamps: `formatting` renders them, `macros` compiles a run identifier's
# own format at build time.
time = { version = "0.3", features = ["formatting", "macros"] }
# Asking whether a process is still alive, with no `unsafe` block of our own.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
tempfile = "3"
# `parsing` is for the tests that read a document's timestamps back.
time = { version = "0.3", features = ["macros", "parsing"] }

[features]
# The end-to-end tests need an interpreter with the language pack and its
# execution backend installed, so the whole target is opt-in rather than part of
# `cargo test`.
e2e = []

[[test]]
name = "e2e"
required-features = ["e2e"]

[lints]
workspace = true
