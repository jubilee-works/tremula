[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "tremula-python"
version = "0.1.0"
description = "Python language pack for tremula, backed by Cosmic Ray."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "jsonschema"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PLW"]

[tool.pyright]
typeCheckingMode = "strict"
