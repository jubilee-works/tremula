[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "tremula-python"
version = "0.1.0"
description = "Python language pack for tremula, backed by Cosmic Ray."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TimeTree, Inc." }]
keywords = ["mutation-testing", "testing", "cosmic-ray", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["cosmic_ray>=8.4.6,<8.5", "pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://github.com/jubilee-works/tremula"
Repository = "https://github.com/jubilee-works/tremula"
Issues = "https://github.com/jubilee-works/tremula/issues"

[project.entry-points."cosmic_ray.operator_providers"]
tremula = "tremula_python.cr_operator:TremulaProvider"

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "jsonschema"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PLW"]

[tool.pyright]
typeCheckingMode = "strict"
